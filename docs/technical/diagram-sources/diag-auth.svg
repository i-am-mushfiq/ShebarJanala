<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="392" viewBox="0 0 1360 392"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="1360" height="392" fill="#ffffff"/><rect x="20" y="108" width="190" height="62" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="115" y="144.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle">Phone number</text><line x1="210" y1="139" x2="254" y2="139" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="254" y="100" width="250" height="80" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="379" y="135.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">OTP challenge</text><text x="379" y="155.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" fill="#333333" text-anchor="middle">5 min, 5 attempts</text><line x1="504" y1="139" x2="548" y2="139" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="548" y="100" width="250" height="80" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="673" y="135.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">PIN, 4 to 6 digits</text><text x="673" y="155.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" fill="#333333" text-anchor="middle">scrypt, salted</text><line x1="798" y1="139" x2="842" y2="139" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="842" y="100" width="210" height="80" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="947" y="135.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">Session issued</text><text x="947" y="155.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" fill="#333333" text-anchor="middle">HS256 JWT</text><line x1="1052" y1="124" x2="1096" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1096" y="62" width="220" height="66" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="1206" y="90.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">Access cookie</text><text x="1206" y="110.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" fill="#333333" text-anchor="middle">15 minutes</text><line x1="1052" y1="154" x2="1096" y2="186" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1096" y="158" width="220" height="80" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="1206" y="193.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">Refresh cookie</text><text x="1206" y="213.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" fill="#333333" text-anchor="middle">30 days, rotated</text><line x1="673" y1="180" x2="673" y2="226" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="548" y="226" width="250" height="66" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="673" y="264.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle">5 fails, 10-min lock</text><line x1="1206" y1="238" x2="1206" y2="284" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1076" y="284" width="260" height="80" rx="4" fill="#ECECFF" stroke="#9370DB" stroke-width="1.3"/><text x="1206" y="319.95" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="600">Replay after 20 s grace</text><text x="1206" y="339.95" font